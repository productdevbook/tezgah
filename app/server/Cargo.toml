[package]
name = "tezgah-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A self-hostable HTTP server over the tezgah commerce library."
publish = false

[lib]
name = "tezgah_server"
path = "src/lib.rs"

[[bin]]
name = "tezgah-server"
path = "src/main.rs"

[dependencies]
tezgah = { path = "../.." }
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
kasapay-core = "0.0.5"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
    "ring",
    "webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "uuid",
    "json",
] }
subtle = { version = "2", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
url = "2"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
