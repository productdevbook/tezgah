name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci --all-features
      # nextest does not run doctests. This step is not redundant.
      - run: cargo test --doc
      - name: Upload the generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi.generated.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The canary, matching the bun that writes bun.lock: the lockfile
          # format tracks the bun version, and a release cannot read one a
          # canary wrote. A rolling tag is the cost of that.
          bun-version: "canary"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      # The panel's types are transcribed from src/api/*.rs by hand because the
      # generated document carries no schemas. Regenerating what it does carry
      # catches a path this panel calls and the crate no longer serves.
      - name: The paths this panel may call
        run: |
          bunx openapi-typescript ../tests/snapshots/openapi.json -o src/api/schema.d.ts
          if git diff --quiet -- src/api/schema.d.ts; then
            exit 0
          fi
          echo "::error::src/api/schema.d.ts is stale — regenerate it from tests/snapshots/openapi.json and commit the result." >&2
          git diff --stat -- src/api/schema.d.ts
          exit 1

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
