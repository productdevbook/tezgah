name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci --all-features
      # nextest does not run doctests. This step is not redundant.
      - run: cargo test --workspace --doc
      - name: Upload the generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi.generated.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The canary, matching the bun that writes bun.lock: the lockfile
          # format tracks the bun version, and a release cannot read one a
          # canary wrote. A rolling tag is the cost of that.
          bun-version: "canary"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # A child route whose parent draws no `<Outlet />` resolves, renders the
      # parent, and never draws the child. Every one of the panel's five "edit
      # a record" screens was in that state from the commit that added them,
      # and nothing else here would have said so.
      - run: bun run check:outlets
      - run: bun run check:host
      - run: bun run build
      # The other consumer: an application mounting these screens installs a
      # package rather than copying a tree. Built here so the seam is checked
      # rather than described — an import that leaves `panel/index.ts` for a
      # file a host cannot reach fails on this line.
      - run: bun run build:lib
      # The panel's types are transcribed from src/api/*.rs by hand because the
      # generated document carries no schemas. Regenerating what it does carry
      # catches a path this panel calls and the crate no longer serves.
      # Everything the document generates, not one file of it. The check used
      # to run openapi-typescript alone; orval arrived beside it and produced
      # code nothing re-checked, so a stale generated client could sit in the
      # tree looking fine. `bun run generate` is the one command that owns all
      # of it, and this runs exactly that.
      - name: What the document generates
        run: |
          bun run generate
          if git diff --quiet -- src; then
            exit 0
          fi
          echo "::error::generated client is stale — run 'bun run generate' in app/client/ and commit the result." >&2
          git diff --stat -- src
          exit 1
      # Both are committed, not produced by `build`, because `tsc -b` needs
      # them before Vite ever runs a plugin. Regenerating and diffing is what
      # stands in for a build-time freshness check.
      - name: The generated fetch client and zod schemas are current
        run: |
          bunx orval
          if git diff --quiet -- src/api/generated; then
            exit 0
          fi
          echo "::error::src/api/generated is stale — run 'bunx orval' and commit the result." >&2
          git diff --stat -- src/api/generated
          exit 1
      - name: The route tree is current
        run: |
          node scripts/generate-routes.mjs
          if git diff --quiet -- src/routeTree.gen.ts; then
            exit 0
          fi
          echo "::error::src/routeTree.gen.ts is stale — run 'node scripts/generate-routes.mjs' and commit the result." >&2
          git diff --stat -- src/routeTree.gen.ts
          exit 1

  # The images, built and thrown away. Nothing else reads app/server/Dockerfile's
  # stand-in list, so a crate target added anywhere else broke the image while
  # every other check stayed green. amd64 only and no push: this is here to
  # fail a pull request, not to publish.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=server-linux/amd64
      - name: panel
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app/client
          file: app/client/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=panel-linux/amd64

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
